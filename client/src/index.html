<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Stack Scaffold</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Project Scaffold</h1>
        <p class="subtitle">Node + Express + Postgres + Vanilla JS</p>
      </header>

      <main>
        <section class="form-container">
          <form id="item-form">
            <input
              type="text"
              id="item-input"
              placeholder="New item content..."
              required
            />
            <button type="submit">Add to Database</button>
          </form>
        </section>

        <section class="list-container">
          <h3>Database Entries</h3>
          <div id="display">
            <p class="loading">Fetching data from server...</p>
          </div>
        </section>
      </main>

      <footer>
        <p>&copy; 2026 - Template Repository</p>
      </footer>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
